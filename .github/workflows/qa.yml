name: PowerShare QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: powershare_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: powershare_ci
      JWT_SECRET: ci-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      FRONTEND_ORIGIN: http://localhost:3000
      E2E_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install exact backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize database
        run: npm run db:init
      - name: Verify demo seed is refused in production
        run: |
          if NODE_ENV=production npm run db:seed:demo; then echo "Demo seed must not run in production"; exit 1; fi
      - name: Verify production refuses weak JWT secrets
        run: |
          if NODE_ENV=production JWT_SECRET=short JWT_REFRESH_SECRET=short timeout 10 node server.js; then echo "Server started with weak secrets"; exit 1; fi
      - name: Seed demo QA data
        run: npm run db:seed:demo
      - name: Run source QA gate (static, unit, contract)
        run: npm run qa
      - name: Run live MySQL + HTTP + Socket.IO QA (smoke, E2E, live suite, smoke again)
        run: npm run qa:live

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production frontend
        run: npm run build
